apiVersion: v1
kind: Pod
metadata:
  name: demo-web
spec:
  containers: 
  - name: web
    image: nginx:1.31.10
    ports:
    - containerPort: 80
  - name: tasks-api
    image: tasks-api:local
    ports:
    - containerPort: 5000
  - name: title-normalizer
    image: title-normalizer:local
    ports:
    - containerPort: 5001
