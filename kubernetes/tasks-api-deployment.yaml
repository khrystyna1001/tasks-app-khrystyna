apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasks-api
  template:
    metadata:
      labels:
        app: tasks-api
    spec:
      containers:
      - name: web
        image: tasks-api:local
        env:
        - name: NORMALIZER_URL
          value: "http://title-normalizer-service:5001"