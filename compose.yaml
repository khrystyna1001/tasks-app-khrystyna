services:
  tasks-api:
    build: services/tasks-api
    ports:
      - "5050:5000"
    environment:
      NORMALIZER_URL: ${NORMALIZER_URL:-http://title-normalizer:5001}
    depends_on:
      title-normalizer:
        condition: service_healthy
  title-normalizer:
    build: services/title-normalizer
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "3000:3000"
