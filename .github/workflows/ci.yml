on: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  services-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest]
        services: [tasks-api, title-normalizer]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check repository code
        uses: actions/checkout@v6
      - name: Install dependencies
        run: cd services/${{ matrix.services }} && pip install -r requirements.txt
      - name: Run tests
        run: cd services/${{ matrix.services }} && pytest